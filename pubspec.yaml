name: app_rolly

description: "Ứng dụng quản lý chi tiêu cá nhân kiểu Rolly"

publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.10.7

dependencies:
  flutter:
    sdk: flutter

  # ICON IOS
  cupertino_icons: ^1.0.8

  # STATE MANAGEMENT
  provider: ^6.1.2

  # SQLITE DATABASE
  sqflite: ^2.4.2+1

  # HỖ TRỢ ĐƯỜNG DẪN DATABASE
  path: ^1.9.1

  # GỌI API GEMINI
  http: ^1.2.1

  # BIỂU ĐỒ THỐNG KÊ
  fl_chart: ^0.68.0

  # FORMAT TIỀN TỆ / NGÀY THÁNG
  intl: ^0.19.0

  # ĐỌC FILE .ENV CHỨA API KEY GEMINI
  flutter_dotenv: ^5.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - .env
    - lib/assets/images/robot.png
    - lib/assets/images/login_bg.png